services:
  billuminatti:
    build: .
    container_name: billuminatti
    restart: unless-stopped
    # Reteaua si procesele gazdei: necesare pentru a vedea porturile reale ale homelab-ului
    network_mode: host
    pid: host
    user: root
    environment:
      PORT: 5299
      AUTH_USER: admin
      AUTH_PASSWORD: schimba-ma   # sau foloseste AUTH_PASSWORD_HASH (node hash-password.js "parola")
      # COOKIE_SECURE: "true"    # activeaza daca e servit prin HTTPS
      DISK_PATHS: /,/host   # adauga aici punctele de montare de urmarit
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
