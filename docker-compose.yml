name: billuminatti

services:
  billuminatti:
    build: .
    container_name: billuminatti
    restart: unless-stopped
    # Reteaua si procesele gazdei: necesare pentru a vedea porturile reale ale homelab-ului
    network_mode: host
    pid: host
    user: root
    environment:
      PORT: 5095
      AUTH_USER: ${AUTH_USER:-admin}
      # Seteaza AUTH_PASSWORD (sau AUTH_PASSWORD_HASH) in .env sau in secretele GitHub; daca lipsesc ambele, se genereaza una (vezi logurile)
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      # COOKIE_SECURE: "true"    # activeaza daca e servit prin HTTPS
      DISK_PATHS: /,/host   # adauga aici punctele de montare de urmarit
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
